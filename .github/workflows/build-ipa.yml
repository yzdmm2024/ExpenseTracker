name: Build ExpenseTracker IPA

on:
  push:
    branches: [master]
    paths:
      - 'Source/**'
      - 'Resources/**'
      - 'Entitlements/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        run: |
          brew install ldid

      - name: Build IPA
        run: |
          chmod +x build_ipa.sh
          ./build_ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseTracker
          path: build/ExpenseTracker.ipa