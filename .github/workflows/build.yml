name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ldid
        run: |
          brew install ldid
          ldid --version

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build IPA
        run: |
          chmod +x build_ipa.sh
          ./build_ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseTracker
          path: build/ExpenseTracker.ipa
          if-no-files-found: error